<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doddily press kit</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F6F8">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--milk:#F4F6F8;--ink:#1E2536;--muted:#667085;--accent:#C7B5F5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--milk);color:var(--ink);font:17px/1.5 "Bricolage Grotesque",system-ui,sans-serif;padding:24px}
main{max-width:460px;text-align:center}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px}
p{margin:0;color:var(--muted)}
a{color:var(--ink);font-weight:800;text-decoration:none;border-bottom:2px solid var(--accent)}
</style>
</head>
<body>
<main>
  <h1>The press kit is on its way.</h1>
  <p>For logos, screenshots or a word with Victoria, email <a href="mailto:hello@doddily.app">hello@doddily.app</a>.</p>
</main>
</body>
</html>
